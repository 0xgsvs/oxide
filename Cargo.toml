[package]
name = "oxide"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.52.3", features = [
  "rt",               # tokio::spawn
  "rt-multi-thread",  # #[tokio::main]
  "macros",           # #[tokio::main], tokio::select!
  "net",              # TcpListener, sqlx TCP
  "signal",           # graceful shutdown
  "sync",             # mpsc channels
  "time",             # timeouts (sqlx, hyper)
  "io-util",          # async I/O (axum, hyper, sqlx)
  "fs",               # sqlx migration file reading
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "migrate",
] }
dotenvy = "0.15.7"
validator = { version = "0.20.0", features = ["derive"] }
tower_governor = "0.8.0"
argon2 = "0.6.0-rc.8"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde_json = "1.0.150"
redis = { version = "1.3.0", features = ["tokio-comp"] }
thiserror = "2.0.18"
tower-http = { version = "0.7.0", features = ["trace", "request-id"] }

[profile.release]
strip = true          # Strip symbols
opt-level = "z"       # Optimize for size (try "s" too, whichever is smaller)
lto = true            # Fat LTO — biggest size win
codegen-units = 1     # Single unit = more inlining
panic = "abort"       # No unwind tables

# nightly only: removes panic strings + backtrace infrastructure (breaks some proc-macro build scripts)
# rustflags = ["-Z", "panic_immediate_abort"]

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
