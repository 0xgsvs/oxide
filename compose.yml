services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oxide_dev
    ports:
      - "5432:5432"
    profiles:
      - full
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
