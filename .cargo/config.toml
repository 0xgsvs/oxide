[build]
rustc-wrapper = "sccache"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
  "-C",
  "link-arg=-fuse-ld=mold",
  "-Z",
  "threads=8",
  "-C",
  "force-frame-pointers=yes",
  "-C",
  "symbol-mangling-version=v0",
]

[unstable]
codegen-backend = true

[profile.dev]
codegen-backend = "cranelift"
